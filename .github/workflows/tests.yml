name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check tests-first rule
        run: python scripts/check_tests_first.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The suite must never reach the real APIs or a real vault. These keys are
      # deliberately bogus so anything that tries fails loudly instead of quietly
      # using a developer's environment. Tests read saved responses from tests/fixtures/.
      - name: Run tests
        env:
          PYTHONUTF8: "1"
          OPENALEX_API_KEY: "test-not-a-real-key"
          S2_API_KEY: "test-not-a-real-key"
        run: pytest --tb=short -q
