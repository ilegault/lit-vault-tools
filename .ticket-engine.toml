# ticket-engine configuration for this repo.
# Generated by bootstrap new, then customized.
default_branch = "master"
daily_cap = 10
concurrency = 2
jules_reserve = 10
box_enabled = true

# Environment the test suite needs, mirroring tests.yml.
# Keys here are deliberately bogus: the suite must never reach the real APIs.
[test_env]
PYTHONUTF8 = "1"
OPENALEX_API_KEY = "test-not-a-real-key"
S2_API_KEY = "test-not-a-real-key"
